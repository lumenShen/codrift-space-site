<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二次元插画素材 — 对照预览</title>
<style>
  :root {
    --paper: #f6f1e7;
    --ink: #3b2f2a;
    --line: #ded2c0;
    --accent: #e0a33e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 24px 64px;
    background: var(--paper);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  header { max-width: 1180px; margin: 0 auto 32px; }
  h1 { font-size: 22px; letter-spacing: .04em; margin: 0 0 8px; }
  p.meta { margin: 0; font-size: 13px; line-height: 1.7; color: #7a6a5c; }
  .grid {
    max-width: 1180px; margin: 0 auto;
    display: grid; gap: 28px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  figure {
    margin: 0; background: #fffdf8;
    border: 1px solid var(--line);
    border-radius: 14px; padding: 12px;
    box-shadow: 0 8px 20px rgba(80, 60, 40, .07);
  }
  .pair { display: flex; gap: 8px; }
  .pair > div { flex: 1; min-width: 0; }
  .pair img {
    width: 100%; height: 220px; object-fit: cover;
    border-radius: 8px; display: block; background: #eee;
  }
  .pair img.new { box-shadow: 0 0 0 2px var(--accent) inset; }
  figcaption { margin-top: 10px; font-size: 12px; color: #6d5c4d; }
  figcaption strong { display: block; font-size: 13px; color: var(--ink); margin-bottom: 4px; }
  .tag { color: #a68a6a; }
  .label { font-size: 10px; letter-spacing: .08em; color: #a68a6a; text-transform: uppercase; }
</style>
</head>
<body>
<header>
  <h1>二次元插画素材 · 8 张</h1>
  <p class="meta">
    统一规格：粗线稿 + 两阶平涂 + 奶油色手绘边框，保留原图角色神态。<br>
    左为原始参考图，右为生成的插画成品；成品均为长边 2560px 级 JPG，可直接用于贴纸、图文素材。
  </p>
</header>

<main class="grid">
  <figure>
    <div class="pair">
      <div><span class="label">原图</span><img src="../pic/01dd34ff-8ed5-497f-86c6-37c8b0730bc3.png" alt="原图"></div>
      <div><span class="label">插画</span><img class="new" src="01_white_tabby_closeup.jpg" alt="插画"></div>
    </div>
    <figcaption><strong>01 · 白猫绿眼特写</strong>1440×2560 <span class="tag">/ 浅笑神态</span></figcaption>
  </figure>

  <figure>
    <div class="pair">
      <div><span class="label">原图</span><img src="../pic/2bf2cb3b-1922-4754-a27f-c444a76e6c06.png" alt="原图"></div>
      <div><span class="label">插画</span><img class="new" src="02_grey_kitten_stare.jpg" alt="插画"></div>
    </div>
    <figcaption><strong>02 · 灰白小猫凝视</strong>1920×1920 <span class="tag">/ 无语呆愣</span></figcaption>
  </figure>

  <figure>
    <div class="pair">
      <div><span class="label">原图</span><img src="../pic/3B226B80AEE9BBE3A8913F9A3093B9F3.jpg" alt="原图"></div>
      <div><span class="label">插画</span><img class="new" src="03_cat_yawn_point.jpg" alt="插画"></div>
    </div>
    <figcaption><strong>03 · 打哈欠被指</strong>2240×1680 <span class="tag">/ 张嘴大笑</span></figcaption>
  </figure>

  <figure>
    <div class="pair">
      <div><span class="label">原图</span><img src="../pic/4d855eef-9869-4b44-8881-befa640cdf5f.png" alt="原图"></div>
      <div><span class="label">插画</span><img class="new" src="04_cream_cat_corn.jpg" alt="插画"></div>
    </div>
    <figcaption><strong>04 · 低头啃玉米</strong>1920×1920 <span class="tag">/ 迷离半睁眼</span></figcaption>
  </figure>

  <figure>
    <div class="pair">
      <div><span class="label">原图</span><img src="../pic/5E38945AF7C45F4A670B49E8BF1C6742.jpg" alt="原图"></div>
      <div><span class="label">插画</span><img class="new" src="05_yellow_blob_walk.jpg" alt="插画"></div>
    </div>
    <figcaption><strong>05 · 黄色小团子走路</strong>1920×1920 <span class="tag">/ 呆萌侧影</span></figcaption>
  </figure>

  <figure>
    <div class="pair">
      <div><span class="label">原图</span><img src="../pic/88cea862-3b2c-4526-9b55-bc03ba3329a1.png" alt="原图"></div>
      <div><span class="label">插画</span><img class="new" src="06_cat_teal_collar.jpg" alt="插画"></div>
    </div>
    <figcaption><strong>06 · 青项圈委屈猫</strong>1440×2560 <span class="tag">/ 无辜大眼</span></figcaption>
  </figure>

  <figure>
    <div class="pair">
      <div><span class="label">原图</span><img src="../pic/C89F501A90CD68D3423636724DF68471.jpg" alt="原图"></div>
      <div><span class="label">插画</span><img class="new" src="07_yellow_laugh.jpg" alt="插画"></div>
    </div>
    <figcaption><strong>07 · 黄色生物狂笑</strong>1920×1920 <span class="tag">/ 仰头大笑</span></figcaption>
  </figure>

  <figure>
    <div class="pair">
      <div><span class="label">原图</span><img src="../pic/e302589c-7c12-493a-8847-ba1c1dd89259.png" alt="原图"></div>
      <div><span class="label">插画</span><img class="new" src="08_cat_peek_pouch.jpg" alt="插画"></div>
    </div>
    <figcaption><strong>08 · 探头小狸花</strong>1680×2240 <span class="tag">/ 仰头期待</span></figcaption>
  </figure>
</main>
</body>
</html>
